name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          for file in web/js/*.js tests/*.mjs scripts/*.mjs; do
            node --check "$file"
          done
      - name: Core, model and native format tests
        run: |
          node tests/run-tests.mjs
          node tests/native-formats.mjs
          node tests/fit-model.mjs
          node tests/batch-model.mjs
          node tests/match-model.mjs
          node tests/report-model.mjs
      - name: Public release audit
        run: node scripts/audit-release.mjs

  browser:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser, mobile and visual regression tests
        run: |
          node scripts/preview.mjs > /tmp/catplot-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          if ! curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
            cat /tmp/catplot-preview.log
            exit 1
          fi
          node tests/browser-workbench.mjs
          node tests/browser-fit.mjs
          node tests/browser-public.mjs
          node tests/browser-batch.mjs
          node tests/browser-workers.mjs
          node tests/browser-match.mjs
          node tests/browser-report.mjs
          node tests/browser-charge.mjs
          node tests/browser-stack-upload.mjs
          node tests/browser-techniques.mjs
          node tests/browser-demo-native.mjs
          node scripts/mobile-check.mjs
          node tests/visual-regression.mjs
